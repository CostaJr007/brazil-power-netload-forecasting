name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Native eccodes library (GRIB reading)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check scripts models tests --select E9,F63,F7,F82
      - name: Tests (offline)
        run: pytest -q tests
