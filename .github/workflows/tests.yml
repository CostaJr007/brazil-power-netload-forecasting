name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Biblioteca nativa do eccodes (leitura de GRIB)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Dependências
        run: pip install -r requirements-ci.txt
      - name: Lint (erros de sintaxe e nomes indefinidos)
        run: ruff check scripts tests --select E9,F63,F7,F82
      - name: Testes (sem rede)
        run: pytest -q tests
